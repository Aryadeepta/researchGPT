name: Gemini Coding Task Start
on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Unique Task ID'
        required: true
      issue_num:
        description: 'Issue Number'
        required: true
jobs:
  start-task:
    runs-on: [self-hosted, linux, wsl, research-control]
    steps:
      - uses: actions/checkout@v4
      - name: Start Task
        run: |
          scripts/gemini-code-control run "${{ github.event.inputs.task_id }}" "${{ github.event.inputs.issue_num }}"
