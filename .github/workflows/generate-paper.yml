name: Generate Research Paper
on:
  workflow_dispatch:
    inputs:
      paper_id:
        description: 'Unique Paper ID'
        required: true
      research_run_id:
        description: 'Research run ID to package into a paper'
        required: true
      runner:
        description: 'Runner (github-hosted or local)'
        required: false
        default: 'github-hosted'
        type: choice
        options:
          - github-hosted
          - local

jobs:
  generate-github-hosted:
    if: ${{ github.event.inputs.runner == 'github-hosted' || github.event.inputs.runner == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: research-runs/${{ github.event.inputs.research_run_id }}
          key: research-${{ github.event.inputs.research_run_id }}-${{ github.run_number }}
          restore-keys: research-${{ github.event.inputs.research_run_id }}-
      - name: Generate Paper
        run: |
          scripts/paper-control start --paper-id "${{ github.event.inputs.paper_id }}" --research-run-id "${{ github.event.inputs.research_run_id }}"
          scripts/paper-control resume --paper-id "${{ github.event.inputs.paper_id }}"
        env:
          RESEARCH_LLM_PROVIDER: ${{ vars.RESEARCH_LLM_PROVIDER || 'none' }}
          RESEARCH_ARTIFACT_ROOT: ${{ github.workspace }}/research-runs
          PAPER_ARTIFACT_ROOT: ${{ github.workspace }}/papers
      - name: Upload Paper Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-draft
          path: "${{ github.workspace }}/papers/${{ github.event.inputs.paper_id }}/"
  generate-local:
    if: ${{ github.event.inputs.runner == 'local' }}
    runs-on: [self-hosted, linux, research-control, local]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: research-runs/${{ github.event.inputs.research_run_id }}
          key: research-${{ github.event.inputs.research_run_id }}-${{ github.run_number }}
          restore-keys: research-${{ github.event.inputs.research_run_id }}-
      - name: Generate Paper
        run: |
          scripts/paper-control start --paper-id "${{ github.event.inputs.paper_id }}" --research-run-id "${{ github.event.inputs.research_run_id }}"
          scripts/paper-control resume --paper-id "${{ github.event.inputs.paper_id }}"
        env:
          RESEARCH_LLM_PROVIDER: ${{ vars.RESEARCH_LLM_PROVIDER || 'none' }}
          RESEARCH_ARTIFACT_ROOT: ${{ github.workspace }}/research-runs
          PAPER_ARTIFACT_ROOT: ${{ github.workspace }}/papers
      - name: Upload Paper Artifact
        uses: actions/upload-artifact@v4
        with:
          name: paper-draft
          path: "${{ github.workspace }}/papers/${{ github.event.inputs.paper_id }}/"
