name: Download Artifacts
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique Run ID'
        required: true
jobs:
  zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: research-runs/${{ github.event.inputs.run_id }}
          key: research-${{ github.event.inputs.run_id }}-${{ github.run_number }}
          restore-keys: research-${{ github.event.inputs.run_id }}-
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: research-state-${{ github.event.inputs.run_id }}
          path: research-runs/${{ github.event.inputs.run_id }}
      - name: Zip Artifacts
        id: zip
        run: |
          ZIP_PATH=$(scripts/zip-results "${{ github.event.inputs.run_id }}")
          echo "zip_path=$ZIP_PATH" >> $GITHUB_OUTPUT
        env:
          RESEARCH_ARTIFACT_ROOT: ${{ github.workspace }}/research-runs
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: results-${{ github.event.inputs.run_id }}
          path: ${{ steps.zip.outputs.zip_path }}
