name: Research Start
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique Run ID'
        required: true
      topic:
        description: 'Research Topic'
        required: true
jobs:
  start:
    runs-on: [self-hosted, linux, wsl]
    steps:
      - uses: actions/checkout@v4
      - name: Start Research Run
        run: scripts/wsl start --run-id "${{ github.event.inputs.run_id }}" --topic "${{ github.event.inputs.topic }}"
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
