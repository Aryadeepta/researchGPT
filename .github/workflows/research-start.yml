name: Research Start
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique Run ID'
        required: true
      topic:
        description: 'Research Topic'
        required: true
      issue_num:
        description: 'Issue Number (optional, for notifications)'
        required: false
      runner:
        description: 'Runner (github-hosted or local)'
        required: false
        default: 'github-hosted'
        type: choice
        options:
          - github-hosted
          - local
jobs:
  start-github-hosted:
    if: ${{ github.event.inputs.runner == 'github-hosted' || github.event.inputs.runner == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: research-runs/${{ github.event.inputs.run_id }}
          key: research-${{ github.event.inputs.run_id }}-${{ github.run_number }}
          restore-keys: research-${{ github.event.inputs.run_id }}-
      - name: Start Research Run
        run: |
          scripts/research-control start --run-id "${{ github.event.inputs.run_id }}" --topic "${{ github.event.inputs.topic }}" --max-nodes 1
        env:
          RESEARCH_ARTIFACT_STORE: local
          RESEARCH_ARTIFACT_ROOT: ${{ github.workspace }}/research-runs
      - uses: actions/upload-artifact@v4
        with:
          name: research-state-${{ github.event.inputs.run_id }}
          path: research-runs/${{ github.event.inputs.run_id }}/
      - uses: actions/cache/save@v4
        with:
          path: research-runs/${{ github.event.inputs.run_id }}
          key: research-${{ github.event.inputs.run_id }}-${{ github.run_number }}
  start-local:
    if: ${{ github.event.inputs.runner == 'local' }}
    runs-on: [self-hosted, linux, research-control, local]
    steps:
      - uses: actions/checkout@v4
      - name: Start Research Run
        run: scripts/research-control start --run-id "${{ github.event.inputs.run_id }}" --topic "${{ github.event.inputs.topic }}" --max-nodes 1
