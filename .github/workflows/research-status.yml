name: Research Status
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique Run ID'
        required: true
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: research-runs/${{ github.event.inputs.run_id }}
          key: research-${{ github.event.inputs.run_id }}-${{ github.run_number }}
          restore-keys: research-${{ github.event.inputs.run_id }}-
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: research-state-${{ github.event.inputs.run_id }}
          path: research-runs/${{ github.event.inputs.run_id }}
      - name: Get Research Run Status
        run: scripts/research-control status --run-id "${{ github.event.inputs.run_id }}"
        env:
          RESEARCH_ARTIFACT_ROOT: ${{ github.workspace }}/research-runs
